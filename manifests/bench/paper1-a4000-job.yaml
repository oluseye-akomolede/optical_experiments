# Paper 1's dx-10 grid check on an A4000: one bounded Job, and the pod log IS the result.
#
# BLOCKED TODAY -- the GPU quota is a live obstacle, not a met precondition. The namespace's
# ResourceQuota mse-power-cap carries requests.nvidia.com/gpu hard=0, used=0, so a 1-GPU pod is
# refused: "exceeded quota: mse-power-cap, requested: requests.nvidia.com/gpu=1, used: 0,
# limited: 0". Raising it 0 -> 1 is the OWNER's decision; the lead applies it. Nobody on this
# rig raises a quota. And a trap for whoever checks: `kubectl apply --dry-run=server` answers
# "created (server dry run)" for this file even while the quota refuses it, because
# ResourceQuota admission is exempt from dry-run -- dry-run green is NOT admissibility.
#
# Runbook (the lead, after the owner raises the namespace's GPU quota 0 -> 1):
#
#   kubectl -n mode-search-engine delete job paper1-bench-dx10-cw993 --ignore-not-found
#   kubectl -n mode-search-engine apply -f manifests/bench/paper1-a4000-job.yaml
#   kubectl -n mode-search-engine logs -f job/paper1-bench-dx10-cw993
#
# Read the log before the 7-day TTL deletes the pod: the run prints progress lines with the
# machine's own Mcell-steps/s, and at the end `measured F = ...` with the settling line. A run
# killed by the deadline leaves only what it printed.
#
# WHAT THIS RUN IS. The dx-10 grid check the owner asked for (18:43Z), priced from the product's
# own estimator at 993 nm, 100 periods, pad 600 nm: 9,166,668 cells, 39,650 steps, 9.93 nm per
# bin, ~1.12 GiB. The Orin's measured rate (r19, r20: 1.31x the estimator) would put it at
# 11,696 s; an A4000 is expected to be faster, and the Job's own progress lines say by how much
# within minutes.
#
# KNOWN OBSTACLE, for the lead: those args are REFUSED by the shipped code -- 9,166,668 cells
# is over fdtd.MAX_CELLS = 8,000,000, and the two bench knobs raise steps and seconds only. The
# alternatives, both priced in openspec/changes/paper1-a4000-bench/tasks.md:
#   (a) dx 12 nm, pad 600 nm -- fits today (6,397,264 cells, 0.79 GiB, 39,650 steps, 6,221.5 s
#       at the estimator's rate = 8,163 s on the Orin). Same manifest, `--dx "12"`, and
#       activeDeadlineSeconds 12600 instead of 18000.
#   (b) the ring-down locator first (--ringdown --band-half 100 --tail-periods 30) to find where
#       a finer grid puts the resonance: also over the cell cap at pad 600, 4,928.0 s at the
#       estimator's rate = 6,465 s on the Orin, activeDeadlineSeconds 10800.
#
# activeDeadlineSeconds, derived (not a rate the estimator cannot give): the record's own
# seconds 8,914.8 s x 1.312 (the Orin's measured factor over the estimator, r19 1.3116,
# r20 1.3119) = 11,696 s, x 1.5 margin = 17,544 s, + 300 s for the scene and the first frames
# = 17,844 s, rounded up to the next half hour = 18,000 s. This Job is the launcher: there is
# no run_cw.sh here and no MSE_CLOCK, and `--max-seconds` below is a pricing verdict, not a
# timer -- a run that has started is stopped by this deadline and by nothing else.
#
apiVersion: batch/v1
kind: Job
metadata:
  name: paper1-bench-dx10-cw993
  namespace: mode-search-engine
  labels:
    app: paper1-bench
    paper1-arm: cw993-dx10
spec:
  backoffLimit: 0                    # a failed run is a result (the log), not a retry
  activeDeadlineSeconds: 18000       # 5 h: see the derivation above
  ttlSecondsAfterFinished: 604800    # 7 days: the log of a 5-hour run must outlive the queue
  template:
    metadata:
      labels:
        app: paper1-bench
        paper1-arm: cw993-dx10
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: mse-harbor-pull
      # Product only, no host: the namespace's GPU quota and the card's own allocatable decide
      # which node. Add `kubernetes.io/hostname: sigma-workerN` only if the lead wants one that
      # is known idle at launch time.
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-RTX-A4000
      containers:
        - name: bench
          # The tag is the revision the image was built FROM: d101aa8 is the commit that
          # introduced Dockerfile.bench-cuda at exactly these contents, and the image was
          # built from that tree and smoke-tested. Push it under this tag and the reference
          # here is the revision, verifiable by rebuilding d101aa8.
          image: harbor.arcadia-ecs.local/mode-search-engine/paper1-bench-cuda:d101aa8
          args:
            - --hex
            - paper
            - --wavelength
            - "993"          # where the dx-20 run found the mode; the locator variant (b)
            - --dx           # says whether a finer grid moves it
            - "10"
            - --mirror-pad
            - "600"          # the Orin's own pad, unchanged, so this is a grid check only
            - --periods
            - "100"          # r20's record: 100.0 periods = 39,650 steps at this dt
            - --window-periods
            - "8"            # the script's own default, named so the F reading is unambiguous
            # The three bench ceilings. All are needed and all are on the command line, where
            # a reviewer reads them: the product's defaults (8,000,000 cells, 20,000 steps,
            # 1,800 s) refuse this record, and only this script's own flags can raise them
            # (4b9d9fc for the first two, the cell one after the lead's 2026-10-16 decision).
            # --max-seconds is a pricing verdict: 8,914.8 s at the estimator's rate, so
            # 10,800 s leaves room without inventing a timer the product does not have.
            # --max-cells is the smallest round million over the priced 9,166,668 (cells are
            # counted in nodes, so the 1.14x headroom also absorbs the +1 node per axis).
            - --max-cells
            - "10000000"
            - --max-steps
            - "200000"
            - --max-seconds
            - "10800"
            - --xp
            - cupy           # the script defaults to numpy, about 3x slower than the
                             # estimator's rate; nothing else on this path would catch that
          env:
            # Match the thread count to the CPU limit: a container CPU limit does not change
            # os.cpu_count(), so an unset count starts one thread per HOST core and is
            # throttled hard (measured). Same four in the image; named here because the Job is
            # what sets the limit.
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "2"}
            - {name: NUMEXPR_NUM_THREADS, value: "2"}
          resources:
            # requests == limits, all three. Memory: the priced grid is ~1.12 GiB by the
            # estimator's own storage per cell (~131 bytes: its printed GiB against cells; the
            # same table prints 0.36 GiB for r20's 2,903,040 cells at 9,166,668/2,903,040 =
            # 3.16x the cells). 1.12 GiB is 1,146.9 MiB, which is 14.0% of this request
            # (8,192 MiB, so the request is 7.1x the estimate) and 7.0% of the card's
            # 16,376 MiB -- both denominators named, because "15% of the card" was wrong.
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: 1}
            limits: {cpu: "2", memory: 8Gi, nvidia.com/gpu: 1}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001           # the image's `bench` user, named so the kubelet does
            runAsGroup: 10001          # not have to inspect the image to verify it
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # cupy's kernel cache lives in $HOME, not /tmp,
                                             # so this is only for the loader's own scratch
      volumes:
        - {name: tmp, emptyDir: {}}
