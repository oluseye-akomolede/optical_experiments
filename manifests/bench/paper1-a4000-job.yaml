# Paper 1's dx-10 grid check on an A4000: one bounded Job, and the pod log IS the result.
#
# BLOCKED TODAY -- the GPU quota is a live obstacle, not a met precondition. The namespace's
# ResourceQuota mse-power-cap carries requests.nvidia.com/gpu hard=0, used=0, so a 1-GPU pod is
# refused: "exceeded quota: mse-power-cap, requested: requests.nvidia.com/gpu=1, used: 0,
# limited: 0". Raising it 0 -> 1 is the OWNER's decision; the lead applies it. Nobody on this
# rig raises a quota. And a trap for whoever checks: `kubectl apply --dry-run=server` answers
# "created (server dry run)" for this file even while the quota refuses it, because
# ResourceQuota admission is exempt from dry-run -- dry-run green is NOT admissibility.
#
# Runbook (the lead, after the owner raises the namespace's GPU quota 0 -> 1):
#
#   kubectl -n mode-search-engine delete job paper1-bench-dx10-cw993 --ignore-not-found
#   kubectl -n mode-search-engine apply -f manifests/bench/paper1-a4000-job.yaml
#   kubectl -n mode-search-engine logs -f job/paper1-bench-dx10-cw993
#
# Read the log before the 7-day TTL deletes the pod: the run prints progress lines with the
# machine's own Mcell-steps/s, and at the end `measured F = ...` with the settling line. A run
# killed by the deadline leaves only what it printed.
#
# WHAT THIS RUN IS. The dx-10 grid check the owner asked for (18:43Z), priced from the product's
# own estimator at 993 nm, 100 periods, mirror-pad 600 nm and the open boundary HELD at the
# distance r20's own run held (320 nm of pad, 200 nm of absorber): 14,048,300 cells, 39,650
# steps, 9.93 nm per bin, 1.63 GiB, 13,662.4 s at the estimator's rate = 17,925 s (4 h 58 m) at
# the Orin's measured factor 1.312 (r19 1.3116, r20 1.3119). An A4000 is expected to be faster,
# and the Job's own progress lines say by how much within minutes.
#
# WHY THE BOUNDARY IS IN THE ARGS. fdtd_layout.OPEN_PAD_CELLS is a cell COUNT, so the product's
# own pad is 320 nm at dx 20 -- which is what r20 ran -- and 160 nm at dx 10. On the defaults
# this record would move the open boundary and the wire's resolution at once, and no difference
# from r20 could then be attributed to either one (this scene's own record: 200 nm against
# 400 nm of pad moved F by 16%). Held at 320/200 nm, the box is r20's own 2318.8 x 2318.8 x
# 2177.0 nm, so dx is the only thing this record changes. --pad-nm/--pml-nm are in the script
# from the revision this tag names; without them the args are `unrecognized arguments`.
#
# THE THREE CEILINGS ARE NOT OPTIONAL. The product's own defaults (8,000,000 cells, 20,000
# steps, 1,800 s) refuse this record on all three counts -- 14,048,300 cells, 39,650 steps,
# 13,662 s -- and only this script's own flags raise them (4b9d9fc for the first two, --max-cells
# on the lead's 2026-10-16 decision). The product's callers are unchanged: the web form and the
# worker call fdtd.check_limits bare. The ceilings are pricing verdicts, not timers -- nothing
# but activeDeadlineSeconds stops a run that has started.
#
# THE ALTERNATIVES, priced the same way (boundary held, mirror-pad 600 nm); the tables are in
# openspec/changes/paper1-a4000-bench/tasks.md:
#   (a) THE LOCATOR FIRST, the lead's order: the ring-down locator, the same grid with a shorter
#       record -- 21,918 steps at its own 1000 nm centre, 7,552.4 s = 9,909 s (2 h 45 m) on the
#       Orin, so activeDeadlineSeconds 16200, with `--ringdown --band-half 100 --tail-periods 30`
#       in place of `--wavelength 993`, --periods and --window-periods and
#       --max-cells/--max-steps/--max-seconds unchanged. It says where a finer grid puts the
#       resonance before the 5-hour record is spent on 993 nm.
#   (b) THE COARSER RUNG IF THIS ONE IS KILLED AND THE CARD IS THE PROBLEM: dx 15 nm is the
#       nearest rung that fits the product's own 8,000,000 cells with the boundary and the mirror
#       pad held -- 5,234,775 cells, 5,091.0 s = 6,679 s on the Orin, activeDeadlineSeconds
#       10800. dx 12 nm is NOT a way out: 8,952,300 cells, still over the cap.
#
# activeDeadlineSeconds, derived (not a rate the estimator cannot give): the record's own
# seconds 13,662.4 s x 1.312 (the Orin's measured factor over the estimator) = 17,925 s, x 1.5
# margin = 26,888 s, + 300 s for the scene and the first frames = 27,188 s, rounded up to the
# next half hour = 28,800 s. This Job is the launcher: there is no run_cw.sh here and no
# MSE_CLOCK, and `--max-seconds` below is a pricing verdict, not a timer -- a run that has
# started is stopped by this deadline and by nothing else.
#
apiVersion: batch/v1
kind: Job
metadata:
  name: paper1-bench-dx10-cw993
  namespace: mode-search-engine
  labels:
    app: paper1-bench
    paper1-arm: cw993-dx10
spec:
  backoffLimit: 0                    # a failed run is a result (the log), not a retry
  activeDeadlineSeconds: 28800       # 8 h: see the derivation above
  ttlSecondsAfterFinished: 604800    # 7 days: the log of a 5-hour run must outlive the queue
  template:
    metadata:
      labels:
        app: paper1-bench
        paper1-arm: cw993-dx10
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: mse-harbor-pull
      # Pinned to sigma-worker2 by the owner (2026-10-16 18:46Z): sigma-worker1's two A4000s
      # belong to the hcm team. The product selector stays so a relabelled node cannot match.
      nodeSelector:
        kubernetes.io/hostname: sigma-worker2
        nvidia.com/gpu.product: NVIDIA-RTX-A4000
      containers:
        - name: bench
          # The tag is the revision the image was built FROM: it carries Dockerfile.bench-cuda
          # unchanged and adds --max-cells, --pad-nm and --pml-nm, the flags the args below
          # pass, and the image was built from that tree and smoke-tested there. Push it under
          # this tag and the reference is the revision, verifiable by rebuilding it.
          image: harbor.arcadia-ecs.local/mode-search-engine/paper1-bench-cuda:f856bbf
          args:
            - --hex
            - paper
            - --wavelength
            - "993"          # where the dx-20 run found the mode; the locator variant (a)
            - --dx           # says whether a finer grid moves it
            - "10"
            - --mirror-pad
            - "600"          # r20's own gold pad, unchanged, so this is a grid check only
            - --pad-nm       # and r20's own open boundary, held as a DISTANCE (see WHY THE
            - "320"          # BOUNDARY IS IN THE ARGS): 32 pad cells at this dx
            - --pml-nm       # 20 absorber cells inside them, 120 nm of open space around the
            - "200"          # parts -- the same nm r20 ran, in twice as many cells
            - --periods
            - "100"          # r20's record: 100.0 periods = 39,650 steps at this dt
            - --window-periods
            - "8"            # the script's own default, named so the F reading is unambiguous
            # The three bench ceilings. All are needed and all are on the command line, where
            # a reviewer reads them: the product's defaults (8,000,000 cells, 20,000 steps,
            # 1,800 s) refuse this record, and only this script's own flags can raise them.
            # --max-seconds is a pricing verdict: 13,662.4 s at the estimator's rate, so
            # 18,000 s is 1.32x that without inventing a timer the product does not have.
            # --max-cells is the smallest round million over the priced 14,048,300.
            - --max-cells
            - "15000000"
            - --max-steps
            - "200000"
            - --max-seconds
            - "18000"
            - --xp
            - cupy           # the script defaults to numpy, about 3x slower than the
                             # estimator's rate; nothing else on this path would catch that
          env:
            # Match the thread count to the CPU limit: a container CPU limit does not change
            # os.cpu_count(), so an unset count starts one thread per HOST core and is
            # throttled hard (measured). Same four in the image; named here because the Job is
            # what sets the limit.
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "2"}
            - {name: NUMEXPR_NUM_THREADS, value: "2"}
          resources:
            # requests == limits, all three. Memory: the priced grid is 1.63 GiB by the
            # estimator's own storage for it (1,754,244,508 bytes = 1,673.0 MiB), which is
            # 20.4% of this request (8,192 MiB, so the request is 4.9x the estimate) and 10.2%
            # of the card's 16,376 MiB -- both denominators named, because "15% of the card"
            # was wrong. CPU 2 and the four thread counts above are one setting.
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: 1}
            limits: {cpu: "2", memory: 8Gi, nvidia.com/gpu: 1}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001           # the image's `bench` user, named so the kubelet does
            runAsGroup: 10001          # not have to inspect the image to verify it
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # cupy's kernel cache lives in $HOME, not /tmp,
                                             # so this is only for the loader's own scratch
      volumes:
        - {name: tmp, emptyDir: {}}
