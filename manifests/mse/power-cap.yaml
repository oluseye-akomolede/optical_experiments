# Owner-approved power cap for mode-search-engine (2026-09-26, set by control-operator).
# Tracked here for reference; never raise it without the owner's OK (see escalation rule).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mse-power-cap
  namespace: mode-search-engine
spec:
  hard:
    count/jobs.batch: '1'
    limits.cpu: '5'
    limits.memory: 18Gi
    pods: '5'
    requests.cpu: '5'
    requests.memory: 18Gi
    requests.nvidia.com/gpu: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mse-container-defaults
  namespace: mode-search-engine
spec:
  limits:
  - default:
      cpu: '1'
      memory: 2Gi
    defaultRequest:
      cpu: 250m
      memory: 512Mi
    max:
      cpu: '4'
      memory: 16Gi
    type: Container
