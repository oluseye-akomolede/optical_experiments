# Owner-approved power cap for mode-search-engine (2026-09-26, set by control-operator).
# RAISED 2026-11-02 by owner decision: the owner asked for owner-uploaded solves to
# run on a cluster RTX A4000 instead of the Jetson, so the GPU slot goes from 0 to 1.
# In the same decision the owner chose ONE GPU card and ONE solve at a time, so
# count/jobs.batch stays at 1 and the CPU/memory bounds tighten to what a single
# solve needs. Still never raise it without the owner's OK (see escalation rule).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mse-power-cap
  namespace: mode-search-engine
spec:
  hard:
    count/jobs.batch: '1'
    limits.cpu: '3'
    limits.memory: 7Gi
    pods: '5'
    requests.cpu: '3'
    requests.memory: 7Gi
    requests.nvidia.com/gpu: '1'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mse-container-defaults
  namespace: mode-search-engine
spec:
  limits:
  - default:
      cpu: '1'
      memory: 2Gi
    defaultRequest:
      cpu: 250m
      memory: 512Mi
    max:
      cpu: '4'
      memory: 16Gi
    type: Container
