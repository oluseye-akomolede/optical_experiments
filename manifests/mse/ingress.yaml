# Tailnet only. The tailscale ingress class gives the service a name on the
# tailnet; there is no public route and no login, because reaching the host
# already requires being on the tailnet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mse-web
  namespace: mode-search-engine
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mse-web
                port:
                  number: 80
  tls:
    - hosts:
        - mse
