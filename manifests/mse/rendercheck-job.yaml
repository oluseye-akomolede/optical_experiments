# Post-deploy render check: loads a finished job's page from the live service in
# headless Chromium (SwiftShader) and fails unless the volume plot really draws.
# Run it after every viewer deploy, with no solver Job in flight (the namespace
# allows one Job at a time), and roll back if it fails:
#
#   kubectl -n mode-search-engine delete job mse-rendercheck --ignore-not-found
#   kubectl -n mode-search-engine apply -f rendercheck-job.yaml
#   kubectl -n mode-search-engine wait --for=condition=complete job/mse-rendercheck --timeout=900s
#   kubectl -n mode-search-engine logs job/mse-rendercheck
#
# Set the image tag to the deployed sha, and MSE_URL to a finished job with at
# least two modes (the check selects mode 2).
apiVersion: batch/v1
kind: Job
metadata:
  name: mse-rendercheck
  namespace: mode-search-engine
  labels:
    app: mse-rendercheck
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600     # long enough to read the logs afterwards
  template:
    metadata:
      labels:
        app: mse-rendercheck
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: mse-harbor-pull
      containers:
        - name: rendercheck
          image: harbor.arcadia-ecs.local/mode-search-engine/mse-rendercheck:4846b0b
          env:
            - name: MSE_URL
              value: http://mse-web.mode-search-engine.svc.cluster.local/jobs/08f832dd-26ba-410f-afe5-ad5dfd08a167
            # The outline-only control frame: the SAME page with the field
            # hidden. Without it the check has no control to compare a field
            # frame against, and a missing control is a FAIL, not a skip -- so
            # leaving this unset would make every run fail rather than run weaker.
            - name: MSE_OUTLINE_URL
              value: http://mse-web.mode-search-engine.svc.cluster.local/jobs/08f832dd-26ba-410f-afe5-ad5dfd08a167?field=off
            - name: OUT_DIR
              value: /out
            # Match the thread count to the CPU limit. A container CPU limit
            # does not change os.cpu_count(), so SwiftShader's worker pool would
            # otherwise start one thread per HOST core and be throttled hard.
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: MKL_NUM_THREADS, value: "2"}
            - {name: OPENBLAS_NUM_THREADS, value: "2"}
          resources:
            # 3Gi, not 2Gi: the passing render ran at 3g, and at 2g the
            # renderer is OOM-killed on the second frame (measured 2026-09-29).
            requests: {cpu: "2", memory: 3Gi}
            limits: {cpu: "2", memory: 3Gi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: out, mountPath: /out}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: out, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
