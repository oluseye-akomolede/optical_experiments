<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STL Uploader</title>
</head>
<body>
    <h1>Upload an STL File</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    <form method="post" enctype="multipart/form-data">
        <input type="file" name="stlfile" required>
        <input type="submit" value="Upload">
    </form>
</body>
</html>
